<style>
    .app-stores {
        display: flex;

    .app-store-link {

    }
    
    .app-store-link:hover {

    }

    h1 {
      font-size: 2.3em;
      font-weight: normal;
      text-transform: lowercase;
      margin-top: 50px;
      animation: fadeInUp 0.8s ease-out 0.4s forwards;
      opacity: 0;
    }

    h2 {
        font-size: 3.1em;
        margin-bottom: 0.5em;
        margin-top: 0.0em;
        animation: fadeInUp 0.8s ease-out 0.2s forwards;
        opacity: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    html {
      display: table;
      font-family: Lato, "Segoe UI", Avenir, Ubuntu, Tahoma, Verdana, Helvetica, sans-serif;
    }

    body {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
      transform: scale(0.75);
      transform-origin: center center;
    }

    svg {
      width: 200px;
      height: 200px;
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeInUp {
        0% {
            opacity: 0;
            transform: translateY(20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes blink {
        0% { opacity: 0; }
        85% { opacity: 0; }
        86% { opacity: 1; }
        87% { opacity: 1; }
        88% { opacity: 1; }
        89% { opacity: 1; }
        90% { opacity: 0; }
        91% { opacity: 0; }
        92% { opacity: 1; }
        93% { opacity: 1; }
        94% { opacity: 0; }
        100% { opacity: 0; }
    }

    @keyframes blinkRight {
        0% { opacity: 0; }
        85% { opacity: 0; }
        86% { opacity: 1; }
        87% { opacity: 1; }
        88% { opacity: 1; }
        89% { opacity: 1; }
        90% { opacity: 0; }
        91% { opacity: 0; }
        92% { opacity: 1; }
        93% { opacity: 1; }
        94% { opacity: 0; }
        100% { opacity: 0; }
    }

    #left-eyelid {
        animation: blink 6s infinite;
        opacity: 0;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        will-change: opacity;
    }

    #right-eyelid {
        animation: blinkRight 6s infinite;
        opacity: 0;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        will-change: opacity;
    }
</style>
