<div class="beta-signup">

    <button type="submit">Sign up</button>

<script>
  document.getElementById('hubspot-form').addEventListener('submit', function(event) {
    event.preventDefault();
    
    const email = this.querySelector('input[name="email"]').value;
    
    // HubSpot API submission
    const portalId = "242623636";  // Replace with your HubSpot portal ID
    const formId = "001098d0-b570-4919-8fe3-05bbb64114cd";      // Replace with your HubSpot form ID
    
    const data = {
      fields: [
        {
          name: "email",
          value: email
        }
      ],
      context: {
        pageUri: window.location.href,
        pageName: document.title
      }
    };
    
    fetch(`https://api.hsforms.com/submissions/v3/integration/submit/${portalId}/${formId}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    })
    .then(response => {
      if (response.ok) {
        // Success
        this.innerHTML = '<div class="success-message">Thank you! We\'ll be in touch soon.</div>';
      } else {
        // Error
        throw new Error('Form submission failed');
      }
    })
    .catch(error => {
      console.error('Error:', error);
      this.innerHTML += '<div class="error-message"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>Something went wrong. Please try again later.</div>';
    });
  });
</script>
