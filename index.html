  <h2>Robutler</h2>

</div>

<div class="beta-signup">
  <form class="signup-form" id="hubspot-form">
    <input type="email" name="email" placeholder="Enter your email for early access" required>
    <button type="submit">Sign up</button>
  </form>
</div>

<script>
  document.getElementById('hubspot-form').addEventListener('submit', function(event) {
    event.preventDefault();
    
    const email = this.querySelector('input[name="email"]').value;
    
    // HubSpot API submission
    const portalId = "242623636";  // Replace with your HubSpot portal ID
    const formId = "001098d0-b570-4919-8fe3-05bbb64114cd";      // Replace with your HubSpot form ID
    
    const data = {
      fields: [
        {
          name: "email",
          value: email
        }
      ],
      context: {
        pageUri: window.location.href,
        pageName: document.title
      }
    };
    
    fetch(`https://api.hsforms.com/submissions/v3/integration/submit/${portalId}/${formId}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    })
    .then(response => {
      if (response.ok) {
        // Success
        this.innerHTML = '<div class="success-message">Thank you! We\'ll be in touch soon.</div>';
      } else {
        // Error
        throw new Error('Form submission failed');
      }
    })
    .catch(error => {
      console.error('Error:', error);
      this.innerHTML += '<div class="error-message"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>Something went wrong. Please try again later.</div>';
    });
  });
</script>

<style>
    .app-stores {
        display: flex;
        justify-content: center;
        gap: 12px;

        animation: fadeInUp 0.8s ease-out 0.6s forwards;
        opacity: 0;
    }
    
    .store-icon {
        height: 36px;
        width: auto;
        opacity: 0.2;
        cursor: not-allowed;
        transition: opacity 0.3s ease, transform 0.3s ease;
        filter: grayscale(100%);
    }
    
    .app-store-link {
        transition: opacity 0.3s ease;
        pointer-events: none;
    }

        transform: translateY(-2px);
    }

    h1 {
      font-size: 1.8em;
      font-weight: normal;
      text-transform: lowercase;
      margin-top: 15px;
      margin-bottom: 20px;

      opacity: 0;
      color: #495057;
      letter-spacing: -0.01em;
    }

    h2 {

        margin-bottom: 0.2em;
        margin-top: 0.3em;
        animation: fadeInUp 0.8s ease-out 0.2s forwards;
        opacity: 0;
        font-weight: 700;
        letter-spacing: -0.02em;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f8f9fa;
    }

    html {
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
      transform: none;
      color: #212529;
      background: linear-gradient(150deg, #f8f9fa 0%, #e9ecef 100%);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    svg {
      width: 100px;
      height: 100px;
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
    }

    @keyframes fadeInUp {
        0% {
            opacity: 0;
            transform: translateY(20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes blink {
        0% { opacity: 0; }
        85% { opacity: 0; }
        86% { opacity: 1; }
        87% { opacity: 1; }
        88% { opacity: 1; }
        89% { opacity: 1; }
        90% { opacity: 0; }
        91% { opacity: 0; }
        92% { opacity: 1; }
        93% { opacity: 1; }
        94% { opacity: 0; }
        100% { opacity: 0; }
    }

    @keyframes blinkRight {
        0% { opacity: 0; }
        85% { opacity: 0; }
        86% { opacity: 1; }
        87% { opacity: 1; }
        88% { opacity: 1; }
        89% { opacity: 1; }
        90% { opacity: 0; }
        91% { opacity: 0; }
        92% { opacity: 1; }
        93% { opacity: 1; }
        94% { opacity: 0; }
        100% { opacity: 0; }
    }

    #left-eyelid {
        animation: blink 6s infinite;
        opacity: 0;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        will-change: opacity;
    }

    #right-eyelid {
        animation: blinkRight 6s infinite;
        opacity: 0;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        will-change: opacity;
    }

    .beta-signup {
        width: 100%;
        padding: 18px;
        background-color: rgba(255, 255, 255, 0.9);
        animation: fadeInUp 0.8s ease-out 0.5s forwards;
        opacity: 0;
        position: fixed;
        bottom: 0;
        left: 0;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        box-shadow: 0 -2px 15px rgba(0, 0, 0, 0.06);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .signup-form {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        display: flex;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        border-radius: 12px;
        overflow: hidden;
        box-sizing: border-box;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border: 1px solid rgba(0, 0, 0, 0.03);
    }
    
    .signup-form:focus-within {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    .signup-form input {
        flex: 1;
        padding: 14px 18px;
        border: none;
        outline: none;
        font-size: 14px;
        background: #ffffff;
        min-width: 0;
        font-family: 'Inter', sans-serif;
    }

    .signup-form button {
        padding: 14px 24px;
        background: #000;
        color: white;
        border: none;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.01em;
    }
    
    .signup-form button:hover {
        background: #333;
        transform: translateY(-1px);
    }

    @media screen and (min-width: 768px) {

        }

            margin-top: 15px;
        }
        
        .store-icon {
            height: 32px;
        }
        
        .beta-signup {
            padding: 10px;
        }
        
        .signup-form {
            flex-direction: row;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }
        
        .signup-form input {
            padding: 12px 16px;
            font-size: 13px;
            border-radius: 0;
            margin-bottom: 0;
            text-align: left;
        }
        
        .signup-form button {
            padding: 12px 16px;
            font-size: 13px;
            border-radius: 0;
        }
    }

    .success-message {
        color: #000000;
        padding: 16px;
        width: 100%;
        text-align: center;
        background: white;
        font-weight: 500;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;

        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(0, 0, 0, 0.1);
        font-size: 14px;
        letter-spacing: 0.01em;
    }
    
    .error-message {
        color: #000000;
        padding: 16px;
        width: 100%;
        text-align: center;
        background: white;
        font-weight: 500;
        border-radius: 12px;

        border: 1px solid rgba(0, 0, 0, 0.1);

    }
    
    .success-message svg, .error-message svg {
